services:
  app:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

  test:
    build:
      context: .
      target: test

  build:
    build:
      context: .
      target: build

volumes:
  node_modules:
